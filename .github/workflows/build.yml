name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / Qt 5.15.2
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Compile release
        run: |
          qmake CONFIG+=release CONFIG-=debug SavvyCAN.pro
          if ($LASTEXITCODE -ne 0) { throw 'qmake failed' }
          nmake /NOLOGO
          if ($LASTEXITCODE -ne 0) { throw 'nmake failed' }
          Get-ChildItem translations/*.ts | ForEach-Object {
            lrelease $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "lrelease failed: $_" }
          }

      - name: Package executable and dependencies
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'package/SavvyCAN-Windows_x64'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath 'release/SavvyCAN.exe' -Destination $package
          windeployqt --release --no-compiler-runtime --no-translations "$package/SavvyCAN.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          # Package app-local MSVC DLLs instead of the redistributable installer.
          if (-not $env:VCToolsRedistDir) { throw 'VCToolsRedistDir is not configured' }
          $crtRoot = Join-Path $env:VCToolsRedistDir 'x64'
          $crt = Get-ChildItem -LiteralPath $crtRoot -Directory |
            Where-Object {
              $_.Name -like 'Microsoft.VC*.CRT' -and
              (Test-Path (Join-Path $_.FullName 'vcruntime140.dll')) -and
              (Test-Path (Join-Path $_.FullName 'msvcp140.dll'))
            } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $crt) { throw "MSVC x64 CRT directory not found in $crtRoot" }
          Write-Host "Packaging MSVC runtime from $($crt.FullName)"
          Get-ChildItem -LiteralPath $crt.FullName -Filter '*.dll' |
            Copy-Item -Destination $package

          # Include dynamically loaded Qt CAN plugins.
          $canPlugins = Join-Path $env:QT_ROOT_DIR 'plugins/canbus'
          $canDestination = Join-Path $package 'canbus'
          New-Item -ItemType Directory -Path $canDestination -Force | Out-Null
          Get-ChildItem "$canPlugins/*.dll" |
            Where-Object { $_.Name -notmatch 'd\.dll$' } |
            Copy-Item -Destination $canDestination

          Copy-Item -LiteralPath 'help' -Destination $package -Recurse
          Copy-Item -LiteralPath 'examples' -Destination $package -Recurse
          Copy-Item -LiteralPath 'LICENSE' -Destination $package
          $translations = Join-Path $package 'translations'
          New-Item -ItemType Directory -Path $translations -Force | Out-Null
          Copy-Item 'translations/*.qm' -Destination $translations
          "Commit: $env:GITHUB_SHA" | Set-Content (Join-Path $package 'BUILD.txt') -Encoding utf8

          foreach ($required in @('SavvyCAN.exe', 'Qt5Core.dll', 'Qt5Gui.dll',
              'Qt5Widgets.dll', 'Qt5Qml.dll', 'Qt5SerialBus.dll',
              'Qt5SerialPort.dll', 'platforms/qwindows.dll',
              'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll')) {
            if (-not (Test-Path (Join-Path $package $required))) {
              throw "Missing packaged dependency: $required"
            }
          }
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Compress-Archive -Path $package -DestinationPath 'dist/SavvyCAN-Windows_x64.zip'

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows_x64
          path: dist/SavvyCAN-Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
